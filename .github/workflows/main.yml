name: Build Epiphany x86_64-musl
on:
  push:
    branches: [master, epiphany]
  workflow_dispatch:

jobs:
  build-musl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout epiphany branch
        uses: actions/checkout@v4
        with:
          ref: epiphany

      - name: Lint and build epiphany in Void musl container
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/void-linux/void-buildroot-musl:latest \
            /bin/bash -e -c '
              xbps-install -Suy xbps
              xbps-install -Suy xtools
              xlint srcpkgs/epiphany/template
              printf "XBPS_CHROOT_CMD=ethereal\nXBPS_ALLOW_CHROOT_BREAKOUT=yes\n" >> etc/conf
              ln -sfn / masterdir
              ./xbps-src -j$(nproc) pkg epiphany
              chmod -R a+rX hostdir/binpkgs
            '

      - name: Upload built .xbps package and repodata
        uses: actions/upload-artifact@v4
        with:
          name: epiphany-x86_64-musl
          path: |
            hostdir/binpkgs/**/*.xbps
            hostdir/binpkgs/**/*-repodata
            hostdir/binpkgs/*.xbps
            hostdir/binpkgs/*-repodata
